<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Token vs Caption | Huayu Chen</title>
  <meta name="description" content="Interactive demo: visual-token vs caption on retrieval and answering for open-gallery CLEVR QA." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="stylesheet" href="./styles.css?v=20260810t" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back" href="../">← Huayu Chen</a>
      <div class="topbar-meta">
        <span class="pill">CLEVR 开放图库</span>
        <span class="pill muted">预计算静态 demo</span>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">Interactive Demo</p>
      <h1>Visual Token <span class="vs">vs</span> Caption</h1>
      <p class="lede">
        从 8 张示例图里拖进图库，走一遍入库与提问检索；再对照 Caption vs Visual Token。跨模型翻译在单独一页。
      </p>
      <div class="mode-tabs" role="tablist" aria-label="Demo mode">
        <button type="button" class="mode-tab active" data-mode="mini" role="tab" aria-selected="true">① Demo</button>
        <button type="button" class="mode-tab" data-mode="pipeline" role="tab" aria-selected="false">② 方法流程</button>
        <button type="button" class="mode-tab" data-mode="journey" role="tab" aria-selected="false">③ 全程逐步</button>
        <button type="button" class="mode-tab" data-mode="overview" role="tab" aria-selected="false">④ 总览证据</button>
        <button type="button" class="mode-tab" data-mode="retrieve" role="tab" aria-selected="false">⑤ 检索对比</button>
        <button type="button" class="mode-tab" data-mode="answer" role="tab" aria-selected="false">⑥ 答题对比</button>
        <button type="button" class="mode-tab" data-mode="translate" role="tab" aria-selected="false">⑦ 跨模型翻译</button>
      </div>
      <div class="overall" id="overall-stats" aria-live="polite"></div>
    </section>

    <section id="pitch-root" class="pitch-root" aria-label="Elevator pitch"></section>

    <section class="picker" id="picker-section">
      <div class="picker-head">
        <h2 id="picker-title">选择问题</h2>
        <p id="picker-desc"></p>
      </div>
      <div class="subtabs" id="answer-subtabs" hidden>
        <button type="button" class="subtab active" data-sub="select">A. 定图对比</button>
        <button type="button" class="subtab" data-sub="read">B. 读证据对比</button>
      </div>
      <div class="q-list" id="q-list" role="listbox" aria-label="Questions"></div>
    </section>

    <section class="active-q" id="active-q" hidden>
      <div class="q-card">
        <div class="q-card-top">
          <span class="qid" id="qid"></span>
          <span class="risk" id="risk"></span>
        </div>
        <h2 id="q-text"></h2>
        <p class="why" id="why"></p>
        <div class="q-meta" id="q-meta"></div>
        <div class="delta-bar" id="delta-bar"></div>
      </div>

      <div class="legend" id="legend"></div>
      <div id="stage-body"></div>
    </section>

    <section id="overview-root" class="overview-root" hidden></section>
    <section id="pipeline-root" class="pipeline-root" hidden></section>
    <section id="pack-root" class="pack-root" hidden></section>
    <section id="journey-root" class="journey-root" hidden></section>
    <section id="live-root" class="live-root" hidden></section>
    <section id="mini-root" class="mini-root" hidden></section>

    <button type="button" class="tour-help-btn" id="tour-help" title="播放使用引导">怎么用?</button>
    <div id="tour-root" class="tour-root" hidden></div>

    <footer class="foot">
      <p id="foot-note" class="foot-note"></p>
      <div id="foot-setting" class="foot-setting" hidden></div>
      <p><a href="../">返回主页</a></p>
    </footer>
  </div>
  <script src="./app.js?v=20260810t"></script>
</body>
</html>
