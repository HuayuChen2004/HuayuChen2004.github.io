<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visual Token vs Caption | Huayu Chen</title>
  <meta name="description" content="Interactive demo: visual-token vs caption on retrieval and answering for open-gallery CLEVR QA." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back" href="../">← Huayu Chen</a>
      <div class="topbar-meta">
        <span class="pill">CLEVR open gallery</span>
        <span class="pill muted">precomputed demo</span>
      </div>
    </header>

    <section class="hero">
      <p class="eyebrow">Interactive Demo</p>
      <h1>Visual Token <span class="vs">vs</span> Caption</h1>
      <p class="lede">
        从总览数字到逐题案例：Caption 在检索、选图、读文本作答上会系统性丢信息；Visual Token 更贴图像证据，并用门控控制成本。
      </p>
      <div class="mode-tabs" role="tablist" aria-label="Demo mode">
        <button type="button" class="mode-tab" data-mode="overview" role="tab" aria-selected="false">① 总览证据</button>
        <button type="button" class="mode-tab active" data-mode="retrieve" role="tab" aria-selected="true">② 检索对比</button>
        <button type="button" class="mode-tab" data-mode="answer" role="tab" aria-selected="false">③ 答题对比</button>
      </div>
      <div class="overall" id="overall-stats" aria-live="polite"></div>
    </section>

    <section class="picker" id="picker-section">
      <div class="picker-head">
        <h2 id="picker-title">选择问题</h2>
        <p id="picker-desc"></p>
      </div>
      <div class="subtabs" id="answer-subtabs" hidden>
        <button type="button" class="subtab active" data-sub="select">A. 用 Caption 选图</button>
        <button type="button" class="subtab" data-sub="read">B. 读 Caption 作答</button>
      </div>
      <div class="q-list" id="q-list" role="listbox" aria-label="Questions"></div>
    </section>

    <section class="active-q" id="active-q" hidden>
      <div class="q-card">
        <div class="q-card-top">
          <span class="qid" id="qid"></span>
          <span class="risk" id="risk"></span>
        </div>
        <h2 id="q-text"></h2>
        <p class="why" id="why"></p>
        <div class="q-meta" id="q-meta"></div>
        <div class="delta-bar" id="delta-bar"></div>
      </div>

      <div class="legend" id="legend"></div>
      <div id="stage-body"></div>
    </section>

    <section id="overview-root" class="overview-root" hidden></section>

    <footer class="foot">
      <p id="foot-note"></p>
      <p><a href="../">返回主页</a></p>
    </footer>
  </div>
  <script src="./app.js"></script>
</body>
</html>
